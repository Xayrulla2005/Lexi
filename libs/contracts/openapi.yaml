openapi: 3.0.3
info:
  title: Lex Dispetcher API
  version: 0.1.0
  description: |
    Bot va veb faqat shu API orqali ishlaydi.
    Mock server: `pnpm mock` -> http://localhost:4010
servers:
  - url: http://localhost:3001
paths:
  /cases:
    post:
      summary: Yangi murojaat ochish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: { type: string, enum: [bot, web] }
                external_user_id: { type: string }
      responses:
        "201":
          description: Yaratildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
  /cases/{id}:
    get:
      summary: Murojaat, tahlil va yo'l xaritasi
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
  /cases/{id}/messages:
    post:
      summary: Matn yoki ovoz qo'shish (ovoz -> STT -> matn)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, example: "3 oydan beri oylik berishmayapti" }
                audio_url: { type: string }
      responses:
        "201":
          description: Qo'shildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /cases/{id}/analyze:
    post:
      summary: AI tahlili va yo'naltirish
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Tahlil tayyor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
  /cases/{id}/documents:
    post:
      summary: Ariza yaratish
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                template: { type: string, example: talabnoma_ish_haqi }
                fields: { type: object, additionalProperties: { type: string } }
      responses:
        "201":
          description: Ariza
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
  /appeals:
    post:
      summary: Rozilikdan keyin murojaatni idoraga yuborish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [case_id, agency_id, document_id, consent]
              properties:
                case_id: { type: string }
                agency_id: { type: string }
                document_id: { type: string }
                consent: { type: boolean, example: true }
      responses:
        "201":
          description: Yuborildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appeal" }
  /appeals/{id}:
    get:
      summary: Murojaat holati
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appeal" }
  /simulator/{agency}/appeals:
    get:
      summary: Simulyator paneli uchun idoraga kelgan murojaatlar
      parameters:
        - name: agency
          in: path
          required: true
          schema: { type: string, example: mehnat_inspeksiyasi }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Appeal" }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
  schemas:
    Case:
      type: object
      properties:
        id: { type: string, example: "c_01" }
        channel: { type: string, enum: [bot, web] }
        status: { type: string, enum: [open, analyzed, appealed, closed] }
        analysis: { $ref: "#/components/schemas/Analysis" }
        route: { $ref: "#/components/schemas/RoutePlan" }
    Message:
      type: object
      properties:
        id: { type: string }
        role: { type: string, enum: [user, assistant] }
        text: { type: string }
    Analysis:
      type: object
      properties:
        risk:
          type: object
          properties:
            level: { type: string, enum: [red, orange, yellow, green], example: yellow }
            reasons: { type: array, items: { type: string } }
        category: { type: string, example: mehnat }
        subcase: { type: string, nullable: true, example: ish_haqi_tolanmagan }
        confidence: { type: number, example: 0.86 }
        needs_lawyer: { type: boolean, example: false }
        rights:
          type: array
          items:
            type: object
            properties:
              text: { type: string, example: "Ish haqi kechiktirilgan har bir kun uchun kompensatsiya" }
              source_id: { type: string, example: "MK-333" }
        user_mistakes: { type: array, items: { type: string } }
        missing_info: { type: array, items: { type: string } }
    RoutePlan:
      type: object
      properties:
        kind: { type: string, enum: [emergency, verified, generic], example: verified }
        steps:
          type: array
          items:
            type: object
            properties:
              order: { type: integer, example: 1 }
              agency_id: { type: string, example: mehnat_inspeksiyasi }
              action: { type: string, example: "Ish beruvchiga yozma talabnoma" }
              deadline_days: { type: integer, nullable: true, example: 10 }
    Document:
      type: object
      properties:
        id: { type: string }
        template: { type: string }
        text: { type: string }
        pdf_url: { type: string, nullable: true }
    Appeal:
      type: object
      properties:
        id: { type: string }
        external_id: { type: string, example: "MI-2026-00451" }
        agency_id: { type: string, example: mehnat_inspeksiyasi }
        status:
          type: string
          enum: [draft, submitted, received, in_review, answered, overdue, escalated]
          example: received
        submitted_at: { type: string, format: date-time }
        due_at: { type: string, format: date-time }
